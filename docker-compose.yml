version: '3.8'

# ================================================================
# AgencyOS — Local Development Stack
# 4 Deployments:
#   1. agency-web      → Port 3000 (public marketing site)
#   2. admin-dashboard → Port 3001 (unified internal system)
#   3. auth-api        → Port 8000 (NestJS backend + auth)
#   4. ai-service      → Port 8001 (FastAPI AI microservice)
#
# Quick start:
#   docker compose up -d                    # all services
#   docker compose --profile infra up -d   # infra only (postgres + redis + mongo)
#   docker compose up auth-api admin-dashboard # backend + dashboard only
# ================================================================

services:
  # ─── Infrastructure ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: agencyos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trifusion_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trifusion_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    profiles:
      - infra
      - default

  mongodb:
    image: mongo:7
    container_name: agencyos-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    profiles:
      - infra
      - default

  redis:
    image: redis:7-alpine
    container_name: agencyos-redis
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    profiles:
      - infra
      - default

  # ─── Database Migration + Seed (run-once job) ─────────────────
  db-migrate:
    image: node:20-alpine
    container_name: agencyos-migrate
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        npx -y pnpm install --frozen-lockfile &&
        pnpm --filter database exec -- prisma migrate deploy &&
        echo '[migrate] Done.'
      "
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/trifusion_db
      - DIRECT_URL=postgresql://user:password@postgres:5432/trifusion_db
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  # ─── Backend: NestJS Auth + API Service ───────────────────────
  auth-api:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    env_file:
      - .env
    container_name: agencyos-auth
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://user:password@postgres:5432/trifusion_db
      - DIRECT_URL=postgresql://user:password@postgres:5432/trifusion_db
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongodb:27017/trifusion_db
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-d5f8b9e67c8a49c2a12a7f5a3b9d0e1c4b7a8d9e0f1a2b3c4d5e6f7a8b9c0d1e}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9}
      - ADMIN_EMAIL=admin@trifusiondynamics.com
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-trifusiondynamicsA3web}
      - DEFAULT_TEMP_PASSWORD=${DEFAULT_TEMP_PASSWORD:-trifusiondynamicsA3web}
      # Allow both frontends
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,https://trifusiondynamics.com,https://ops.trifusiondynamics.com
      - COOKIE_DOMAIN=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    profiles:
      - default

  # ─── Frontend 1: Public Marketing Website ─────────────────────
  agency-web:
    build:
      context: .
      dockerfile: ./apps/agency-web/Dockerfile
    container_name: agencyos-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_ADMIN_DASHBOARD_URL=http://localhost:3001
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      auth-api:
        condition: service_healthy
    restart: always
    profiles:
      - default

  # ─── Frontend 2: Unified Internal System (Admin Dashboard) ────
  admin-dashboard:
    build:
      context: .
      dockerfile: ./apps/admin-dashboard/Dockerfile
    container_name: agencyos-dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      auth-api:
        condition: service_healthy
    restart: always
    profiles:
      - default

  # ─── Backend: AI Microservice (FastAPI) ───────────────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: agencyos-ai
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    profiles:
      - default

  # ─── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agencyos-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/api.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      auth-api:
        condition: service_healthy
      agency-web:
        condition: service_started
      admin-dashboard:
        condition: service_started
      ai-service:
        condition: service_started
    restart: always
    profiles:
      - default

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
