services:
  - type: web
    name: trifusion-auth
    env: docker
    dockerfilePath: services/auth/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    preDeployCommand: pnpm --filter @agency-os/database db:push && pnpm --filter @agency-os/database db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trifusion-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: trifusion-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: trifusion-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@trifusiondynamics.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEFAULT_TEMP_PASSWORD
        generateValue: true
      - key: PORT
        value: 8000

databases:
  - name: trifusion-db
    plan: starter
    region: oregon
    databaseName: trifusion_auth
    user: trifusion

  - name: trifusion-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
