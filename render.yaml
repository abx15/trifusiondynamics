# ================================================================
# AgencyOS — Render.com Deployment Configuration
#
# Backend Services (deployed on Render):
#   1. agency-os-backend    → NestJS Auth + API  (port 8000)
#   2. agency-os-ai-service → FastAPI AI service (port 8000)
#
# Frontend Services (deployed on Vercel — NOT Render):
#   1. agency-web      → trifusiondynamics.com  (or Vercel URL)
#   2. admin-dashboard → ops.trifusiondynamics.com (or Vercel URL)
#
# After deploying frontends to Vercel, update CORS_ALLOWED_ORIGINS below.
# ================================================================

services:
  # ─── NestJS Auth + API Service ────────────────────────────────
  - type: web
    name: agency-os-backend
    runtime: docker
    plan: free # Upgrade to paid for production workloads
    # Docker build from monorepo root
    dockerContext: .
    dockerfilePath: ./services/auth/Dockerfile
    envVars:
      # ── Database ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false # Set in Render dashboard → Neon PostgreSQL URL
      - key: DIRECT_URL
        sync: false # Set in Render dashboard → Neon direct connection URL
      - key: MONGODB_URL
        sync: false # Set in Render dashboard → MongoDB Atlas URL
      - key: REDIS_URL
        sync: false # Set in Render dashboard → Upstash Redis URL

      # ── JWT Secrets ───────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── Admin Bootstrap ───────────────────────────────────────
      - key: ADMIN_EMAIL
        value: admin@trifusiondynamics.com
      - key: ADMIN_PASSWORD
        sync: false # Set in Render dashboard
      - key: DEFAULT_TEMP_PASSWORD
        value: Welcome@123

      # ── CORS — Production Vercel domains ─
      - key: CORS_ALLOWED_ORIGINS
        value: https://trifusiondynamics.vercel.app,https://trifusiondynamicsadmin.vercel.app

      # ── Cookie ────────────────────────────────────────────────
      # Empty string = host-only cookies (no cross-subdomain)
      - key: COOKIE_DOMAIN
        value: ""

      # ── AI Service ─────────────────────────────────────────────
      - key: AI_SERVICE_URL
        value: https://trifusiondynamics-ai-api.onrender.com
      - key: AI_SERVICE_SECRET
        value: "change-me-in-production"

      # ── AI API Keys (used by auth service AI proxy endpoints) ──
      - key: ANTHROPIC_API_KEY
        sync: false # Set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard

      # ── Runtime ───────────────────────────────────────────────
      - key: NODE_ENV
        value: production

  # ─── FastAPI AI Microservice ───────────────────────────────────
  - type: web
    name: agency-os-ai-service
    runtime: docker
    plan: free # Upgrade to paid for production workloads
    dockerContext: ./services/ai-service
    dockerfilePath: ./services/ai-service/Dockerfile
    envVars:
      # AI API Keys
      - key: ANTHROPIC_API_KEY
        sync: false # Set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard
      
      # CORS Configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://trifusiondynamics-api.onrender.com,https://trifusiondynamics.vercel.app,https://trifusiondynamicsadmin.vercel.app
      
      # Internal Secret
      - key: AI_SERVICE_SECRET
        value: "change-me-in-production"
      
      # Optional
      - key: DATABASE_URL
        sync: false # Set if AI service needs direct DB access
      - key: SENTRY_DSN
        sync: false # Optional — error tracking
      - key: PYTHONUNBUFFERED
        value: "1"

# ── Notes ──────────────────────────────────────────────────────────
# Redis  → Use Upstash (https://upstash.com) — free tier available
# Postgres → Use Neon (https://neon.tech) — free tier available
# MongoDB  → Use MongoDB Atlas — free tier available
# Frontends → Deploy both Next.js apps to Vercel (separate projects)
#   - agency-web: set env vars NEXT_PUBLIC_API_URL, NEXT_PUBLIC_ADMIN_DASHBOARD_URL, NEXT_PUBLIC_SITE_URL
#   - admin-dashboard: set env vars NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WS_URL
