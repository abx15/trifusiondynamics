# NOTE: AI_SERVICE_SECRET is generated by Render (stable per service).
# It must be copied manually to the AI service's environment variables so both
# services share the same value for X-Internal-Secret authentication.

services:
  - type: web
    name: trifusion-auth
    env: docker
    dockerfilePath: services/auth/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trifusion-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: trifusion-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: trifusion-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@trifusiondynamics.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEFAULT_TEMP_PASSWORD
        generateValue: true
      - key: AI_SERVICE_URL
        value: https://trifusiondynamics-ai-api.onrender.com
      - key: AI_SERVICE_SECRET
        generateValue: true
      - key: PORT
        value: 8000
      - key: CORS_ALLOWED_ORIGINS
        value: https://trifusiondynamicsadmin.vercel.app,https://trifusiondynamics.vercel.app
      - key: COOKIE_DOMAIN
        value: .vercel.app
      - key: NEXT_PUBLIC_ADMIN_DASHBOARD_URL
        value: https://trifusiondynamicsadmin.vercel.app
      - key: NEXT_PUBLIC_AGENCY_WEB_URL
        value: https://trifusiondynamics.vercel.app

databases:
  - name: trifusion-db
    plan: starter
    region: oregon
    databaseName: trifusion_auth
    user: trifusion

  - name: trifusion-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
