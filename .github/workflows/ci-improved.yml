name: AgencyOS CI/CD (Improved)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      run-integration-tests:
        description: 'Run integration tests'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─── Dependencies & Cache Setup ───────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.pnpm }}
      node-version: ${{ env.NODE_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store path
        id: store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "pnpm=pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependencies
        run: pnpm list --depth=0

  # ─── Lint (All Packages) ───────────────────────────────────────────────────────
  lint:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agency-web
          - admin-dashboard
          - auth
          - database
          - types
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} lint

  # ─── Type Check (All Packages) ─────────────────────────────────────────────────
  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agency-web
          - admin-dashboard
          - auth
          - database
          - types
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} typecheck || pnpm --filter ${{ matrix.package }} build

  # ─── Unit Tests (Auth Service) ───────────────────────────────────────────────────
  test-unit:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agencyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agencyos_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/agencyos_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-secret-access
      JWT_REFRESH_SECRET: test-secret-refresh
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @agency-os/database db:generate

      - name: Push test schema
        run: pnpm --filter @agency-os/database db:push --skip-generate

      - name: Run unit tests
        run: pnpm --filter auth test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/auth/coverage/lcov.info
          flags: auth-service
          name: auth-service-coverage

  # ─── Build (All Packages) ───────────────────────────────────────────────────────
  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agency-web
          - admin-dashboard
          - auth
          - database
          - types
    env:
      NEXT_PUBLIC_API_URL: https://trifusiondynamics-api.onrender.com/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-build-${{ github.run_id }}
          path: |
            apps/${{ matrix.package }}/.next
            services/${{ matrix.package }}/dist
            packages/${{ matrix.package }}/dist
          retention-days: 1
          if-no-files-found: warn

  # ─── E2E Tests (Optional) ─────────────────────────────────────────────────────
  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.run-integration-tests == 'true' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agencyos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agencyos_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/agencyos_e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-secret-access
      JWT_REFRESH_SECRET: test-secret-refresh
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-${{ github.run_id }}'
          merge-multiple: true

      - name: Generate Prisma client
        run: pnpm --filter @agency-os/database db:generate

      - name: Push test schema
        run: pnpm --filter @agency-os/database db:push --skip-generate

      - name: Seed test data
        run: pnpm --filter @agency-os/database seed

      - name: Run E2E tests
        run: pnpm test:e2e || echo "E2E tests not configured yet"
        continue-on-error: true

  # ─── Security Audit ─────────────────────────────────────────────────────────────
  security:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  # ─── Database Validation ───────────────────────────────────────────────────────
  validate-db:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agencyos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agencyos_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/agencyos_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'pnpm'

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @agency-os/database db:generate

      - name: Validate Prisma schema
        working-directory: packages/database
        run: npx prisma validate

      - name: Check schema format
        working-directory: packages/database
        run: npx prisma format --check

      - name: Check for schema drift
        working-directory: packages/database
        run: |
          git diff --exit-code prisma/schema.prisma || {
            echo "::error::Schema has uncommitted changes"
            exit 1
          }

      - name: Migration diff check
        working-directory: packages/database
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --exit-code
        continue-on-error: true

  # ─── Build Size Report ─────────────────────────────────────────────────────────
  build-size:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-${{ github.run_id }}'
          merge-multiple: true

      - name: Calculate build sizes
        run: |
          echo "=== AgencyOS Build Size Report ===" > build-size.txt
          echo "" >> build-size.txt
          echo "Agency Web: $(du -sh apps/agency-web/.next 2>/dev/null | cut -f1 || echo 'N/A')" >> build-size.txt
          echo "Admin Dashboard: $(du -sh apps/admin-dashboard/.next 2>/dev/null | cut -f1 || echo 'N/A')" >> build-size.txt
          echo "Auth Service: $(du -sh services/auth/dist 2>/dev/null | cut -f1 || echo 'N/A')" >> build-size.txt
          echo "Database Package: $(du -sh packages/database/dist 2>/dev/null | cut -f1 || echo 'N/A')" >> build-size.txt
          echo "Types Package: $(du -sh packages/types/dist 2>/dev/null | cut -f1 || echo 'N/A')" >> build-size.txt
          cat build-size.txt

      - name: Comment build sizes on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('build-size.txt', 'utf8');
            const body = [
              '## 📦 Build Size Report',
              '',
              '```',
              content,
              '```',
              '',
              `> Commit: \`${{ github.sha }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ─── Summary Report ────────────────────────────────────────────────────────────
  summary:
    needs: [lint, typecheck, test-unit, build, security, validate-db]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Unit Tests: ${{ needs.test-unit.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "DB Validation: ${{ needs.validate-db.result }}"

      - name: Create summary
        if: always()
        run: |
          echo "## AgencyOS CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB Validation | ${{ needs.validate-db.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
