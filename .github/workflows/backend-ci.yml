name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "packages/**"
  pull_request:
    branches:
      - main
    paths:
      - "services/**"
      - "packages/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10"
  NODE_VERSION: "20"

jobs:
  # ─── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get pnpm store path
        id: store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint auth service
        run: pnpm --filter auth lint
        continue-on-error: true

      - name: Test auth service
        run: pnpm --filter auth test
        continue-on-error: true

      - name: Build auth service
        run: pnpm --filter auth build
        continue-on-error: true

      - name: Upload auth service build
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-build-${{ github.run_id }}
          path: services/auth/dist
          retention-days: 1
          if-no-files-found: warn

  # ─── AI Service ─────────────────────────────────────────────────────────────
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest flake8

      - name: Lint AI service
        working-directory: services/ai-service
        run: flake8 . || true

      - name: Test AI service
        working-directory: services/ai-service
        run: pytest || true

  # ─── Database Package ────────────────────────────────────────────────────────
  database-package:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agencyos_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/agencyos_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get pnpm store path
        id: store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @agency-os/database build

      - name: Validate Prisma schema
        working-directory: packages/database
        run: npx prisma validate

      - name: Check schema format
        working-directory: packages/database
        run: npx prisma format --check
        continue-on-error: true

      - name: Check schema drift
        working-directory: packages/database
        run: |
          git diff --exit-code prisma/schema.prisma || echo "Schema has drifted (non-blocking)"
        continue-on-error: true

  # ─── Security Scan ───────────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get pnpm store path
        id: store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
